# GitHub disables every scheduled workflow in a repository after 60 days
# without repository activity (scheduled runs themselves do not count). That is
# what silently stopped this scraper: the schedule was flipped to
# "disabled_inactivity" 60 days after the last push.
#
# This job pushes a heartbeat commit weekly, which resets that 60-day clock, and
# re-enables the scraper workflow in case it was already disabled.
name: Keepalive

on:
  schedule:
    - cron: "0 4 * * 0" # Weekly on Sundays
  workflow_dispatch:

permissions:
  actions: write
  contents: write

jobs:
  keepalive:
    name: Keep scheduled workflows alive
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Heartbeat commit
        run: |
          date -u +"%Y-%m-%dT%H:%M:%SZ" > .keepalive
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .keepalive
          git commit -m "Keepalive heartbeat" || exit 0
          git push

      - name: Re-enable scraper workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow enable retrieve.yml || true
